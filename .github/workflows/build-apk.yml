name: Build & Deploy CJY Music APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Release APK
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x test 2>&1 | tee ../build.log

      - name: Upload Failure Log to OpenList
        if: failure()
        env:
          OPENLIST_URL: "https://pan.cjy.qzz.io"
          OPENLIST_USER: "admin"
          OPENLIST_PASS: "Chen924619232"
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log || true
          TOKEN=$(curl -s -X POST "$OPENLIST_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "{\"username\":\"$OPENLIST_USER\",\"password\":\"$OPENLIST_PASS\"}" | jq -r '.data.token')
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            ENCODED_PATH=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/移动云盘/apps/build_error.log'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_PATH" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: text/plain" \
              --data-binary @"build.log"
          fi

      - name: Verify Built APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-cjy-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Deploy APK to OpenList (China Mobile Cloud Drive & Local)
        env:
          OPENLIST_URL: "https://pan.cjy.qzz.io"
          OPENLIST_USER: "admin"
          OPENLIST_PASS: "Chen924619232"
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/release/*universal*.apk android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          VER_NAME=$(node -p "require('./package.json').version")
          VER_CODE=$(node -p "require('./package.json').versionCode")
          APK_NAME="lx-music-cjy-release.apk"
          VERSIONED_APK="lx-music-cjy-release-v${VER_NAME}-code${VER_CODE}.apk"
          echo "Found APK: $APK_PATH ($VER_NAME code $VER_CODE), preparing upload..."
          echo "Logging into OpenList at $OPENLIST_URL..."
          TOKEN=$(curl -s -X POST "$OPENLIST_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "{\"username\":\"$OPENLIST_USER\",\"password\":\"$OPENLIST_PASS\"}" | jq -r '.data.token')

          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            echo "1. Uploading to /local/apps/ on OpenList for instant access..."
            ENCODED_LOCAL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/local/apps/' + '$APK_NAME'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_LOCAL" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK_PATH" || echo "Local main upload notice"

            ENCODED_LOCAL_VER=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/local/apps/' + '$VERSIONED_APK'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_LOCAL_VER" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK_PATH" || echo "Local versioned upload notice"

            echo "1.1 Generating and deploying version.json for in-app online updates..."
            python3 -c "
import json, os, subprocess
ver = '$VER_NAME'
code = '$VER_CODE'
try:
    commit_msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%B']).decode('utf-8', errors='ignore').strip()
except Exception:
    commit_msg = ''
desc = commit_msg if commit_msg else f'版本更新 v{ver}'
data = {
    'version': ver,
    'desc': desc,
    'downloadUrl': '$OPENLIST_URL/d/local/apps/$APK_NAME',
    'history': []
}
with open('version.json', 'w', encoding='utf-8') as f:
    json.dump(data, f, ensure_ascii=False, indent=2)
"
            ENCODED_LOCAL_VER_JSON=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/local/apps/version.json'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_LOCAL_VER_JSON" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: application/json" \
              --data-binary @"version.json" || echo "Local version.json upload notice"

            echo "2. Attempting upload to /移动云盘/apps/..."
            curl -s -X POST "$OPENLIST_URL/api/fs/remove" \
              -H "Authorization: $TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d "{\"names\":[\"$APK_NAME\", \"$VERSIONED_APK\"],\"dir\":\"/移动云盘/apps\"}" || true
            sleep 2

            ENCODED_MAIN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/移动云盘/apps/' + '$APK_NAME'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_MAIN" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK_PATH" || echo "139yun upload skipped"

            ENCODED_VER=$(python3 -c "import urllib.parse; print(urllib.parse.quote('/移动云盘/apps/' + '$VERSIONED_APK'))")
            curl -s -X PUT "$OPENLIST_URL/api/fs/put" \
              -H "Authorization: $TOKEN" \
              -H "File-Path: $ENCODED_VER" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK_PATH" || echo "139yun versioned upload skipped"

            echo "3. Refreshing directory caches..."
            curl -s -X POST "$OPENLIST_URL/api/fs/list" \
              -H "Authorization: $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"path":"/local/apps","refresh":true}' || true
            curl -s -X POST "$OPENLIST_URL/api/fs/list" \
              -H "Authorization: $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"path":"/移动云盘/apps","refresh":true}' || true

            echo "APK Deploy finished successfully!"
          else
            echo "OpenList login token missing, but artifact was uploaded to GitHub."
          fi

